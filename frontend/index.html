<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      script-src sem 'unsafe-inline': por isso o init de tema vive em /theme-init.js (arquivo
      próprio) em vez de <script> inline. connect-src precisa de ws:/wss: porque o webphone abre
      WebSocket SIP pra um host dinâmico (Asterisk da empresa), não fixo em build time. media-src
      precisa de blob: (prévia de voz autenticada é buscada via axios/blob e tocada com
      `new Audio(blobUrl)`, ver audio-form-dialog.tsx) + storage.googleapis.com/*.elevenlabs.io
      (preview_url fixo da ElevenLabs, ainda usado como fallback visual) — sem isso o <audio> é
      bloqueado silenciosamente, sem erro de rede, só CSP no console. img-src precisa do mesmo
      storage.googleapis.com pela textura perlin-noise que o VoiceOrb (componentes/voice-picker/
      voice-orb.tsx, shader Three.js) carrega via <img>/texture loader - sem isso o Canvas lança
      erro não capturado e derruba a rota inteira (react-three-fiber não engole falha de textura).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://storage.googleapis.com; font-src 'self' data:; media-src 'self' blob: https://storage.googleapis.com https://*.elevenlabs.io; connect-src 'self' %VITE_API_URL% ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Sofon PABX</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
