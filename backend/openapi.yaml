openapi: 3.1.0

info:
  title: Sofon PABX API
  version: 1.0.0
  description: |
    Backend API para o sistema de gerenciamento PABX.
    - Autenticação via JWT (RS256) com refresh token
    - RBAC: roles `admin`, `reseller`, `user`
    - Tokens revogáveis via Redis JTI
    - Rate limit: 100 req/min por IP

servers:
  - url: http://localhost:3333
    description: Local

tags:
  - name: Auth
  - name: Users
  - name: Companies
  - name: DIDs
  - name: Health

# ─── SECURITY ────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── REUSABLE SCHEMAS ───────────────────────────────────────────────────────
  schemas:

    # Primitives
    Cuid2:
      type: string
      pattern: '^[a-z0-9]{24,}$'
      example: clh1234567890abcdefghijkl

    Email:
      type: string
      format: email
      example: user@example.com

    Password:
      type: string
      minLength: 6
      format: password

    Timestamp:
      type: string
      format: date-time
      example: '2026-06-08T12:00:00.000Z'

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT válido por 15 minutos
        refreshToken:
          type: string
          description: JWT válido por 7 dias

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string

    RegisterRequest:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
          minLength: 1
        username:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    RegisterResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Cuid2'
        name:
          type: string
        username:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    # ── Users ─────────────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [admin, reseller, user]

    UserStatus:
      type: string
      enum: [active, inactive]

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Cuid2'
        name:
          type: string
        username:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        webhookSlug:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CreateUserRequest:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
          minLength: 1
        username:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        username:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    # ── Companies ─────────────────────────────────────────────────────────────
    Company:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Cuid2'
        name:
          type: string
        doc:
          type: string
          nullable: true
          description: CNPJ/CPF ou identificador fiscal
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        doc:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
        userId:
          $ref: '#/components/schemas/Cuid2'
          description: Associa a empresa a um usuário no momento da criação

    UpdateCompanyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        doc:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    # ── DIDs ──────────────────────────────────────────────────────────────────
    Did:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Cuid2'
        number:
          type: string
          pattern: '^\d+$'
          description: Número DID (somente dígitos)
          example: '1130001234'
        companyId:
          $ref: '#/components/schemas/Cuid2'
        company:
          $ref: '#/components/schemas/Company'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CreateDidRequest:
      type: object
      required: [number, companyId]
      properties:
        number:
          type: string
          pattern: '^\d+$'
          example: '1130001234'
        companyId:
          $ref: '#/components/schemas/Cuid2'

    UpdateDidRequest:
      type: object
      minProperties: 1
      properties:
        number:
          type: string
          pattern: '^\d+$'

    # ── Errors ────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        requestId:
          type: string

    ValidationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation error
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  # ─── REUSABLE RESPONSES ─────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            error: Unauthorized
            message: Token invalid or expired

    Forbidden:
      description: Permissão insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            error: Forbidden
            message: Insufficient role

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            error: Not Found
            message: Resource not found

    ValidationFailed:
      description: Dados inválidos na requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    Conflict:
      description: Conflito — recurso já existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            error: Conflict
            message: Resource already exists

  # ─── REUSABLE PARAMETERS ────────────────────────────────────────────────────
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Cuid2'

    UserIdParam:
      name: id_user
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Cuid2'

    CompanyIdParam:
      name: id_company
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Cuid2'

# ─── GLOBAL SECURITY ────────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ─── PATHS ──────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra o primeiro usuário (admin)
      description: |
        Só funciona quando não existe nenhum usuário no banco.
        O usuário criado recebe role `admin` automaticamente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário admin criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Já existe um usuário cadastrado
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticação — retorna access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin@example.com
              password: secret123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Credenciais inválidas ou usuário inativo
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova o access token via refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalida os tokens do usuário via JTI no Redis
      responses:
        '204':
          description: Logout realizado
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Users ───────────────────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: Lista todos os usuários
      description: Requer role `admin`.
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Cria novo usuário
      description: Requer role `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email já cadastrado
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags: [Users]
      summary: Busca usuário por ID
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Atualiza usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Remove usuário
      description: Requer role `admin`.
      responses:
        '204':
          description: Usuário removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/companies:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags: [Users]
      summary: Lista empresas vinculadas ao usuário
      responses:
        '200':
          description: Empresas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Companies ───────────────────────────────────────────────────────────────
  /companies:
    get:
      tags: [Companies]
      summary: Lista todas as empresas
      description: Admin retorna todas; outros roles retornam apenas as suas.
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Companies]
      summary: Cria empresa
      description: Requer role `admin` ou `reseller`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Empresa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags: [Companies]
      summary: Busca empresa por ID
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Companies]
      summary: Atualiza empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Empresa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Companies]
      summary: Remove empresa e seus DIDs (cascade)
      description: Requer role `admin`.
      responses:
        '204':
          description: Empresa removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/users/{id_user}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'

    get:
      tags: [Companies]
      summary: Lista empresas de um usuário específico
      responses:
        '200':
          description: Empresas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── DIDs ────────────────────────────────────────────────────────────────────
  /dids:
    get:
      tags: [DIDs]
      summary: Lista DIDs
      description: Admin retorna todos; outros roles retornam apenas os das suas empresas.
      responses:
        '200':
          description: Lista de DIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Did'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [DIDs]
      summary: Cria DID
      description: |
        Número deve ser único por empresa (`UNIQUE(number, companyId)`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDidRequest'
            example:
              number: '1130001234'
              companyId: clh1234567890abcdefghijkl
      responses:
        '201':
          description: DID criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Did'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Empresa não encontrada
          $ref: '#/components/responses/NotFound'
        '409':
          description: Número já existe nessa empresa
          $ref: '#/components/responses/Conflict'

  /dids/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags: [DIDs]
      summary: Busca DID por ID
      responses:
        '200':
          description: DID encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Did'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [DIDs]
      summary: Atualiza DID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDidRequest'
      responses:
        '200':
          description: DID atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Did'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Número já existe nessa empresa
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [DIDs]
      summary: Remove DID
      responses:
        '204':
          description: DID removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dids/company/{id_company}:
    parameters:
      - $ref: '#/components/parameters/CompanyIdParam'

    get:
      tags: [DIDs]
      summary: Lista DIDs de uma empresa
      responses:
        '200':
          description: DIDs da empresa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Did'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
