x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - dokploy-network
  # Permite o container falar com o Asterisk nativo no host (AMI, ver ami-client.ts) sem
  # network_mode: host — "host-gateway" resolve pro IP do host visto de dentro do container
  # (Docker 20.10+; funciona tanto no Docker Engine da VPS quanto no Dokploy).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # Diretório inteiro (não só dialplan-extra) — ensureBaseDialplan()/features.repository.ts
    # (src/asterisk/) escrevem sofon-managed.conf/features.conf direto em /etc/asterisk pra
    # autocurar drift sem reinstalar; sem montar o pai, esses caminhos só existiam dentro da
    # imagem do container, nunca alcançando o Asterisk real do host. Web também escreve aqui
    # (dialplan-file.repository.ts é chamado pelas rotas HTTP), não é exclusivo do worker.
    - /etc/asterisk:/etc/asterisk
    - /var/lib/asterisk/sounds:/var/lib/asterisk/sounds
    - /var/spool/asterisk/monitor:/var/spool/asterisk/monitor:ro
    # Só leitura, pro dashboard medir o tamanho (GET /dashboard/infra, ver dashboard.service.ts)
    - /var/log/asterisk:/var/log/asterisk:ro
    # AVATAR_STORAGE_DIR (users.service.ts) sem isso é disco local de cada container - com
    # replicas: 3 (ver abaixo) cada réplica só enxerga o avatar que ELA mesma recebeu no upload,
    # e o Traefik balanceia os GETs seguintes pras outras 2 réplicas, que respondem 404 (avatar
    # "sumia"/trocava sozinho dependendo de qual réplica atendia o request)
    - avatars_sofon_data:/app/storage/avatars

services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: postgres_sofon
    restart: unless-stopped
    environment:
      POSTGRES_DB: asterisk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    command: >
      postgres
      -c timezone=America/Sao_Paulo
      -c log_timezone=America/Sao_Paulo
    # Porta publicada só em loopback do host: o Asterisk nativo (fora do Docker) acessa via ODBC
    # em 127.0.0.1:5433 (ver setups/odbc-realtime.sh) — isso independe de network_mode do backend,
    # mas não precisa (e não deve) ser alcançável de fora da VPS.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_sofon_data:/var/lib/postgresql
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: redis_sofon
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    # Só backend-web/backend-worker falam com o Redis, via nome de serviço na dokploy-network —
    # publicar em loopback é só pra permitir redis-cli manual na própria VPS quando precisar debugar.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_sofon_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Singleton — AGI (porta fixa 4573) + AMI events (listener único) + jobs de cron (holiday
  # resync, recálculo de afinidade). Rodar mais de 1 réplica duplica efeito colateral (job
  # recalculando penalty 2x em paralelo) e conflita porta no AGI — nunca escalar este serviço.
  backend-worker:
    <<: *backend-common
    container_name: sofon_backend_worker
    environment:
      PROCESS_ROLE: worker
      # Nome do serviço na rede interna (dokploy-network), não mais 127.0.0.1 — sem
      # network_mode: host o container não enxerga o host via loopback.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/asterisk
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@redis:6379
    # Publica a 4573 só em loopback do host — é assim que o Asterisk nativo (AGI_HOST=127.0.0.1 no
    # .env) consegue chamar de volta o FastAGI server do container, sem expor o protocolo AGI (sem
    # autenticação própria) pra fora da VPS.
    ports:
      - "127.0.0.1:4573:4573"
    # dokploy-network é overlay (Swarm) — publicar porta host (`ports:` acima) de um container
    # avulso (não um service Swarm de verdade) numa rede overlay não é sustentado direito pelo
    # Docker: o docker-proxy que atende 127.0.0.1:4573 falha em resolver o IP real do container
    # nela, encaminhando pra um IP de rede bridge padrão que nem existe mais. sofon-agi-bridge é
    # rede bridge normal dedicada só a isso — sofon-agi-bridge precisa existir antes do deploy
    # (`docker network create --driver bridge sofon-agi-bridge`), dokploy-network continua sendo
    # usada pra falar com postgres/redis (isso nunca teve esse problema).
    networks:
      dokploy-network: {}
      sofon-agi-bridge: {}

  # API HTTP — stateless, escalável via replicas. Sem network_mode: host todas as réplicas
  # escutam a MESMA porta interna (3333); o Traefik do Dokploy descobre e faz load balancing
  # entre elas sozinho (provider Docker), sem upstream/keepalive manual e sem porta por réplica.
  backend:
    <<: *backend-common
    deploy:
      replicas: 3
    environment:  
      PROCESS_ROLE: web
      PORT: 3333
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/asterisk
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@redis:6379
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Preencher via UI do Dokploy (aba Domains) — ela injeta os labels do Traefik sozinha.
    # Se preferir manual, descomentar e ajustar o domínio/id:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.sofon-backend.rule=Host(`api.seudominio.com`)
    #   - traefik.http.routers.sofon-backend.entrypoints=websecure
    #   - traefik.http.services.sofon-backend.loadbalancer.server.port=3333

networks:
  dokploy-network:
    external: true
  sofon-agi-bridge:
    external: true

volumes:
  # external: true — os volumes já existem na VPS (criados fora deste compose); sem isso,
  # o Dokploy avisa "volume already exists but was created for project X" a cada deploy porque
  # tenta gerenciá-los como se fossem dele.
  postgres_sofon_data:
    name: postgres_sofon_data
    external: true
  redis_sofon_data:
    name: redis_sofon_data
    external: true
  avatars_sofon_data:
    name: avatars_sofon_data
    external: true
